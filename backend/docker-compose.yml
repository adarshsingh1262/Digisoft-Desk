name: digisoft-helpdesk-backend

services:
  postgres:
    image: postgres:16-alpine
    # Disable with: docker compose up (no --profile local-db) after editing the api
    # and worker services' DATABASE_URL below to point at a managed database instead.
    profiles: ['local-db']
    environment:
      POSTGRES_USER: digisoft
      POSTGRES_PASSWORD: digisoft
      POSTGRES_DB: digisoft_helpdesk
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digisoft -d digisoft_helpdesk']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO stopped publishing the community image to Docker Hub; quay.io is the
    # current canonical source (minio/minio:latest 404s with "pull access denied").
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: digisoft
      MINIO_ROOT_PASSWORD: digisoft123
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio-data:/data']

  mailhog:
    image: mailhog/mailhog:latest
    ports: ['1025:1025', '8025:8025']

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: [.env]
    environment:
      # Deliberately not ${DATABASE_URL:-...}: .env always sets DATABASE_URL (to
      # localhost, for running pnpm dev outside Docker), and Compose reads that
      # same .env for its own variable substitution — so the fallback here would
      # never trigger and every container would try to reach Postgres on its own
      # loopback. The postgres service below is what --profile local-db means;
      # pointing at a managed database instead is a one-line edit to this file.
      DATABASE_URL: postgresql://digisoft:digisoft@postgres:5432/digisoft_helpdesk?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      EMAIL_PROVIDER: smtp
      STORAGE_LOCAL_PATH: /var/lib/digisoft/storage
    volumes: ['file-storage:/var/lib/digisoft/storage']
    ports: ['4000:4000']
    depends_on:
      redis: { condition: service_healthy }
      # postgres only exists under --profile local-db; required: false lets api
      # start without it when pointed at a managed database instead.
      postgres: { condition: service_healthy, required: false }
    command: sh -c "cd /app && pnpm --filter @digisoft/db migrate:deploy && cd api && node dist/main.js"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: [.env]
    environment:
      # Deliberately not ${DATABASE_URL:-...}: .env always sets DATABASE_URL (to
      # localhost, for running pnpm dev outside Docker), and Compose reads that
      # same .env for its own variable substitution — so the fallback here would
      # never trigger and every container would try to reach Postgres on its own
      # loopback. The postgres service below is what --profile local-db means;
      # pointing at a managed database instead is a one-line edit to this file.
      DATABASE_URL: postgresql://digisoft:digisoft@postgres:5432/digisoft_helpdesk?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      EMAIL_PROVIDER: smtp
      # The same volume as the API: the worker writes report exports, the API serves them.
      STORAGE_LOCAL_PATH: /var/lib/digisoft/storage
    volumes: ['file-storage:/var/lib/digisoft/storage']
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy, required: false }

volumes:
  file-storage:
  postgres-data:
  redis-data:
  minio-data:
