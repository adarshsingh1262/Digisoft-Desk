# Single-server production stack: docker compose -f docker-compose.prod.yml up -d
# Reads .env (copied from .env.production.example). See deploy/deploy.sh.
name: digisoft-helpdesk-prod

x-app-env: &app-env
  DATABASE_URL: postgresql://digisoft:${POSTGRES_PASSWORD}@postgres:5432/digisoft_helpdesk?schema=public
  REDIS_URL: redis://redis:6379
  STORAGE_LOCAL_PATH: /var/lib/digisoft/storage

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: digisoft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: digisoft_helpdesk
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digisoft -d digisoft_helpdesk']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: [.env]
    environment: *app-env
    volumes: ['file-storage:/var/lib/digisoft/storage']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    env_file: [.env]
    environment: *app-env
    volumes: ['file-storage:/var/lib/digisoft/storage']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
        NEXT_PUBLIC_SOCKET_URL: https://${API_DOMAIN}
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api]

volumes:
  postgres-data:
  redis-data:
  file-storage:
  caddy-data:
  caddy-config:
